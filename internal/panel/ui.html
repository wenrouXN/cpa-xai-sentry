<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>XAI Sentry · 账号巡检</title>
<style>
:root{
  --bg:#eff2f7; --accent:#409eff; --accent2:#79bbff; --text:#2c3e50; --muted:#8b95a6; --reg:#5f6c7b;
  --card:#fffffff2; --border:#0f172a14; --ok:#67c23a; --warn:#e6a23c; --danger:#f56c6c; --soft:#f5f9ff;
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);color:var(--text);background:linear-gradient(120deg,#f0f7ff,#e7f2ff 50%,#edf7ff);font-size:12.5px}
.wrap{max-width:1400px;margin:0 auto;padding:12px 14px 24px}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start;margin-bottom:8px}
h1{font-size:16px;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.eyebrow{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.04em}
.sub{color:var(--muted);font-size:11.5px;margin-top:2px;max-width:760px;line-height:1.4}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid #409eff33;background:#409eff14;color:#337ecc}
.badge.ok{background:#f0f9eb;color:#529b2e;border-color:#c2e7b0}
.badge.warn{background:#fdf6ec;color:#b88230;border-color:#f5dab1}
.badge.danger{background:#fef0f0;color:#c45656;border-color:#fbc4c4}
.badge.off{background:#f4f4f5;color:#909399;border-color:#dcdfe6}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;backdrop-filter:blur(10px);margin-bottom:8px}
.card h2{font-size:12.5px;margin:0 0 8px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
@media(max-width:1200px){.kpis{grid-template-columns:repeat(5,1fr)}}
@media(max-width:700px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{border:1px solid var(--border);border-radius:10px;padding:7px 8px;background:#fff;min-height:58px}
.kpi b{display:block;font-size:18px;line-height:1.1;margin:2px 0;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:10.5px;font-weight:700}
.kpi.accent{border-color:#409eff55;background:linear-gradient(160deg,#ecf5ff,#fff)}
.kpi.warn{border-color:#e6a23c55;background:linear-gradient(160deg,#fdf6ec,#fff)}
.kpi.danger{border-color:#f56c6c55;background:linear-gradient(160deg,#fef0f0,#fff)}
.kpi.ok{border-color:#67c23a55;background:linear-gradient(160deg,#f0f9eb,#fff)}
button,input,select{font:inherit}
button{appearance:none;border:1px solid var(--border);background:#fff;color:var(--text);border-radius:8px;padding:5px 9px;cursor:pointer;line-height:1.2}
button.primary{background:var(--accent);border-color:#337ecc;color:#fff}
button.warn{background:#fdf6ec;border-color:#f5dab1;color:#b88230}
button.danger{background:var(--danger);border-color:#c45656;color:#fff}
button.on{background:#67c23a;border-color:#529b2e;color:#fff}
button.off{background:#fff;border-color:#fbc4c4;color:#c45656}
button:disabled{opacity:.5;cursor:not-allowed}
button.xs{padding:3px 7px;font-size:11px;border-radius:7px}
input,select{border:1px solid var(--border);border-radius:8px;padding:5px 8px;background:#fff;color:var(--text);min-width:0}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 6px;padding:7px 8px;background:linear-gradient(180deg,#f6faff,#fff);border:1px solid var(--border);border-radius:10px}
.table-wrap{max-height:min(62vh,640px);overflow:auto;border:1px solid var(--border);border-radius:10px;background:#fff}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--border);vertical-align:top}
th{position:sticky;top:0;background:#f8fbff;color:var(--muted);font-weight:700;font-size:11px;z-index:1}
tr:hover td{background:#409eff0c}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px}
.muted{color:var(--muted)}
.tag{display:inline-block;padding:1px 6px;border-radius:999px;font-size:10.5px;border:1px solid var(--border);background:#f8fafc;white-space:nowrap}
.tag.active{background:#f0f9eb;color:#529b2e;border-color:#c2e7b0}
.tag.cooldown,.tag.wait{background:#fdf6ec;color:#b88230;border-color:#f5dab1}
.tag.candidate,.tag.trash{background:#fef0f0;color:#c45656;border-color:#fbc4c4}
.tag.manual,.tag.review{background:#f4f4f5;color:#606266}
.tag.observe,.tag.none{background:#ecf5ff;color:#337ecc;border-color:#b3d8ff}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:#fff;border-radius:999px;padding:2px 8px;font-size:11px}
.chip b{color:var(--accent)}
.grid2{display:grid;grid-template-columns:1.4fr .9fr;gap:8px}
@media(max-width:980px){.grid2{grid-template-columns:1fr}}
.swbar{display:flex;gap:6px;flex-wrap:wrap}
.sw{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:3px 8px;background:#fff}
.sw label{font-size:11px;color:var(--reg)}
.toast{position:fixed;right:12px;top:12px;background:#fff;border:1px solid var(--border);padding:8px 12px;border-radius:10px;display:none;box-shadow:0 8px 24px #0f172a1a;z-index:20;max-width:380px}
.logbox{max-height:220px;overflow:auto;background:#0b1220;color:#dbe7ff;border-radius:10px;padding:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.45}
.logbox .l-act{color:#79bbff}.logbox .l-sig{color:#fbbf24}.logbox .l-err{color:#f87171}
.pending{display:flex;gap:8px;flex-wrap:wrap}
.pending .box{flex:1;min-width:120px;border:1px dashed #409eff55;border-radius:10px;padding:7px 8px;background:#f5f9ff}
.pending b{display:block;font-size:16px}
.reason{color:var(--reg);font-size:11px;line-height:1.3;max-width:220px}
.meta{color:var(--muted);font-size:11px}
.actions{display:flex;gap:4px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="eyebrow">XAI ACCOUNT INSPECTION</div>
      <h1>XAI Sentry 账号巡检 <span id="ver" class="badge">v0.1.1</span> <span id="modeBadge" class="badge">mode</span></h1>
      <div class="sub">对标 CPAMP Codex 巡检信息密度：KPI 条 + 建议动作 + 密表 + 可折叠日志。仅在确认后执行破坏性操作；observe 默认不自动处置。</div>
    </div>
    <div class="row">
      <input id="cfgKey" type="password" placeholder="X-Management-Key" style="width:160px"/>
      <button class="xs" onclick="saveKey()">保存 Key</button>
      <button class="xs" onclick="refresh()">刷新</button>
      <button class="xs primary" onclick="runTick()">Run tick</button>
      <button class="xs warn" onclick="applyPreset('safe-guard')">safe-guard</button>
      <button class="xs" onclick="applyPreset('observe')">观察</button>
    </div>
  </div>

  <div class="card">
    <h2><span>巡检集合 / 建议动作</span><span class="meta" id="updatedAt">—</span></h2>
    <div class="kpis" id="kpis"></div>
    <div class="pending" id="pending" style="margin-top:8px"></div>
    <div class="chips" id="signalChips" style="margin-top:8px"></div>
    <div class="swbar" style="margin-top:8px">
      <div class="sw"><label>Sentry</label><button id="swSentry" class="xs" onclick="toggle('sentry_enabled')">—</button></div>
      <div class="sw"><label>自动冷却</label><button id="swCool" class="xs" onclick="toggle('auto_cooldown')">—</button></div>
      <div class="sw"><label>自动候选</label><button id="swCand" class="xs" onclick="toggle('auto_candidate')">—</button></div>
      <div class="sw"><label>自动垃圾箱</label><button id="swDel" class="xs" onclick="toggle('auto_delete')">—</button></div>
      <div class="sw"><label>巡查</label><button id="swPatrol" class="xs" onclick="toggle('patrol_enabled')">—</button></div>
      <span class="meta" id="cfgLine"></span>
    </div>
  </div>

  <div class="grid2">
    <div class="card" style="margin:0">
      <h2><span>巡检结果</span><span class="meta" id="accMeta">0</span></h2>
      <div class="toolbar">
        <input id="q" placeholder="搜索账号 / 文件 / 信号 / 建议动作" style="flex:1;min-width:160px" oninput="debouncedRefresh()"/>
        <select id="view" onchange="refresh()">
          <option value="focus">focus</option>
          <option value="all">all</option>
        </select>
        <select id="stateFilter" onchange="refresh()">
          <option value="">状态</option>
          <option>active</option>
          <option>cooldown_quota</option>
          <option>cooldown_spending</option>
          <option>cooldown_permission</option>
          <option>candidate_dead</option>
          <option>user_manual</option>
          <option>trashed</option>
        </select>
        <select id="signalFilter" onchange="refresh()">
          <option value="">信号</option>
          <option>free_usage_429</option>
          <option>spending_limit_402</option>
          <option>auth_401</option>
          <option>permission_403</option>
        </select>
        <select id="actionFilter" onchange="refresh()">
          <option value="">建议动作</option>
          <option value="cooldown">cooldown</option>
          <option value="candidate">candidate</option>
          <option value="trash">trash</option>
          <option value="wait">wait</option>
          <option value="review">review</option>
          <option value="manual">manual</option>
          <option value="observe">observe</option>
          <option value="none">none</option>
        </select>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>账号 / Auth</th>
              <th>文件名</th>
              <th>认证状态</th>
              <th>信号</th>
              <th>Streak</th>
              <th>建议动作</th>
              <th>判定原因</th>
              <th>恢复</th>
              <th>更新</th>
            </tr>
          </thead>
          <tbody id="accBody"></tbody>
        </table>
      </div>
    </div>

    <div>
      <div class="card" style="margin:0 0 8px">
        <h2>
          <span>垃圾箱 · 待恢复/清除</span>
          <span class="row">
            <button class="xs danger" onclick="purgeExpired()">清到期</button>
          </span>
        </h2>
        <div class="table-wrap" style="max-height:220px">
          <table>
            <thead><tr><th>账号</th><th>信号</th><th>到期</th><th>动作</th></tr></thead>
            <tbody id="trashBody"></tbody>
          </table>
        </div>
      </div>
      <div class="card" style="margin:0">
        <h2>
          <span>巡检日志</span>
          <button class="xs" id="logToggle" onclick="toggleLogs()">折叠</button>
        </h2>
        <div id="logbox" class="logbox">尚未加载</div>
        <div class="meta" id="logMeta" style="margin-top:6px"></div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
let CFG={}, timer=null, logsOpen=true, LAST_LOGS=[];
const API="/v0/management/cpa-xai-sentry";
const KEY_LS="cpa-xai-sentry-management-key";
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function getKey(){return (document.getElementById('cfgKey').value||localStorage.getItem(KEY_LS)||'').trim()}
function saveKey(){const k=document.getElementById('cfgKey').value.trim(); if(k) localStorage.setItem(KEY_LS,k); else localStorage.removeItem(KEY_LS); toast(k?'Key 已保存':'已清除 Key'); refresh()}
async function j(path, opt){
  opt=opt||{}; const headers=Object.assign({},opt.headers||{});
  const k=getKey(); if(k){headers['X-Management-Key']=k; headers['Authorization']='Bearer '+k}
  let url=path;
  if(path.startsWith('/')) url=API+path; else url=API+'/'+path;
  const r=await fetch(url,Object.assign({},opt,{headers}));
  const text=await r.text(); let data; try{data=JSON.parse(text)}catch(e){data={raw:text}}
  if(!r.ok) throw new Error((data&&data.error)||text||('HTTP '+r.status));
  if(data&&data.ok===true&&data.result!=null){
    if(typeof data.result==='object'&&data.result.Body!=null){
      try{const body=typeof data.result.Body==='string'?data.result.Body:new TextDecoder().decode(new Uint8Array(data.result.Body)); return JSON.parse(body)}catch(e){return data.result}
    }
    if(typeof data.result==='string'){try{return JSON.parse(data.result)}catch(e){return data}}
    return data.result;
  }
  return data;
}
function modeBadge(mode){
  const el=document.getElementById('modeBadge'); el.className='badge';
  if(mode==='observe') el.classList.add('ok');
  else if(mode==='safe-guard'||mode==='cooldown') el.classList.add('warn');
  else if(mode==='auto_trash') el.classList.add('danger');
  else el.classList.add('off');
  el.innerHTML='<span class="dot"></span>'+esc(mode||'—');
}
function sw(id,on){const b=document.getElementById(id); b.className='xs '+(on?'on':'off'); b.textContent=on?'ON':'OFF'}
function tag(cls,text){return '<span class="tag '+cls+'">'+esc(text)+'</span>'}
function stateTag(st){
  if(st==='active') return tag('active',st);
  if(String(st).startsWith('cooldown')) return tag('cooldown',st);
  if(st==='candidate_dead') return tag('candidate',st);
  if(st==='user_manual') return tag('manual',st);
  if(st==='trashed'||st==='purged') return tag('trash',st);
  return tag('',st);
}
function actionTag(a){
  const cls=({cooldown:'cooldown',candidate:'candidate',trash:'trash',wait:'wait',review:'review',manual:'manual',observe:'observe',none:'none',restore_or_purge:'trash'}[a]||'');
  return tag(cls,a||'—');
}
function renderKPIs(s, trashCount){
  s=s||{};
  const items=[
    ['巡检集合',s.total||0,'accent'],
    ['Active',s.active||0,'ok'],
    ['冷却中',s.cooldown||0,'warn'],
    ['候选',s.candidate||0,'danger'],
    ['有信号',s.with_signal||0,''],
    ['建议冷却',s.suggest_cooldown||0,'warn'],
    ['建议候选',s.suggest_candidate||0,'danger'],
    ['建议垃圾箱',s.suggest_trash||0,'danger'],
    ['待复查',s.suggest_review||0,'warn'],
    ['垃圾箱',trashCount||0,''],
  ];
  document.getElementById('kpis').innerHTML=items.map(([l,v,c])=>'<div class="kpi '+(c||'')+'"><span>'+l+'</span><b>'+v+'</b></div>').join('');
  document.getElementById('pending').innerHTML=[
    ['建议冷却',s.suggest_cooldown||0],
    ['建议候选',s.suggest_candidate||0],
    ['建议垃圾箱',s.suggest_trash||0],
    ['等待恢复',s.suggest_wait||0],
    ['手动禁用',s.user_manual||0],
  ].map(([l,v])=>'<div class="box"><span class="muted">'+l+'</span><b>'+v+'</b></div>').join('');
}
function renderSignals(sc){
  sc=sc||{};
  const keys=Object.keys(sc);
  document.getElementById('signalChips').innerHTML=keys.length?keys.map(k=>'<span class="chip">'+esc(k)+' <b>'+sc[k]+'</b></span>').join(''):'<span class="muted">暂无信号聚合</span>';
}
function renderLogs(logs){
  LAST_LOGS=logs||[];
  document.getElementById('logMeta').textContent='共 '+(LAST_LOGS.length)+' 条 · 最新在上';
  if(!logsOpen){
    document.getElementById('logbox').innerHTML='<span class="muted">日志已折叠，共 '+LAST_LOGS.length+' 条</span>';
    return;
  }
  const lines=(LAST_LOGS).slice().reverse().slice(0,120).map(e=>{
    const cls=String(e.action||'').includes('fail')||String(e.action||'').includes('error')?'l-err':'l-act';
    return '<div><span class="muted">'+esc((e.at||'').replace('T',' ').replace('Z',''))+'</span> '+
      '<span class="'+cls+'">'+esc(e.action)+'</span> '+
      '<span class="l-sig">'+esc(e.signal||'-')+'</span> '+
      '<span>'+esc(e.auth||'')+'</span> '+
      '<span class="muted">'+esc(e.reason||'')+'</span></div>';
  });
  document.getElementById('logbox').innerHTML=lines.join('')||'暂无日志';
}
function toggleLogs(){
  logsOpen=!logsOpen;
  document.getElementById('logToggle').textContent=logsOpen?'折叠':'展开';
  renderLogs(LAST_LOGS);
}
function debouncedRefresh(){clearTimeout(timer); timer=setTimeout(refresh,220)}
async function refresh(){
  try{
    const qs=new URLSearchParams({view:document.getElementById('view').value});
    const q=document.getElementById('q').value.trim(); if(q) qs.set('q',q);
    const stf=document.getElementById('stateFilter').value; if(stf) qs.set('state',stf);
    const sif=document.getElementById('signalFilter').value; if(sif) qs.set('signal',sif);
    const af=document.getElementById('actionFilter').value; if(af) qs.set('action',af);
    const st=await j('/state?'+qs.toString());
    CFG=st.config||{};
    modeBadge(st.mode);
    document.getElementById('ver').textContent='v'+(st.version||'0.1.1');
    document.getElementById('updatedAt').textContent='更新 '+(st.updated_at||'—').replace('T',' ').replace('Z','');
    renderKPIs(st.summary, st.trash_count||0);
    renderSignals(st.signal_counts||{});
    sw('swSentry',!!CFG.sentry_enabled); sw('swCool',!!CFG.auto_cooldown); sw('swCand',!!CFG.auto_candidate); sw('swDel',!!CFG.auto_delete); sw('swPatrol',!!CFG.patrol_enabled);
    document.getElementById('cfgLine').textContent='tick '+(CFG.tick_seconds||30)+'s · trash '+(CFG.trash_retention_days||7)+'d'+(CFG.trash_auto_purge?' auto':'')+' · key '+(CFG.management_key_set?'set':'missing');
    document.getElementById('accMeta').textContent=(st.account_count||0)+' rows / observed '+((st.summary&&st.summary.total)||0);
    document.getElementById('accBody').innerHTML=(st.accounts||[]).map(a=>'<tr>'+
      '<td><div>'+esc(a.email||'—')+'</div><div class="mono muted">'+esc(a.auth_index)+'</div><div class="muted">'+esc(a.tier||'')+(a.disable_source?(' · '+a.disable_source):'')+'</div></td>'+
      '<td class="mono">'+esc(a.file_name||'')+'</td>'+
      '<td>'+stateTag(a.state)+'</td>'+
      '<td>'+esc(a.last_signal||'')+'</td>'+
      '<td class="mono">'+esc(a.streak_summary||'')+'</td>'+
      '<td>'+actionTag(a.suggested_action)+'</td>'+
      '<td class="reason">'+esc(a.reason||'')+'</td>'+
      '<td class="mono">'+esc(a.recover_at||'')+'</td>'+
      '<td class="mono">'+esc(a.updated_at||'')+'</td></tr>').join('')||
      '<tr><td colspan="9" class="muted">无匹配结果</td></tr>';

    const tr=await j('/trash');
    const items=tr.trash||[];
    document.getElementById('trashBody').innerHTML=items.length?items.map(t=>'<tr>'+
      '<td><div>'+esc(t.email||'—')+'</div><div class="mono muted">'+esc(t.file_name||t.auth_index||'')+'</div></td>'+
      '<td>'+esc(t.signal||'')+'</td>'+
      '<td class="mono">'+esc(t.expires_at||'')+'</td>'+
      '<td class="actions">'+
        '<button class="xs btn-restore" data-id="'+esc(t.id)+'">恢复</button>'+
        '<button class="xs primary btn-restore-en" data-id="'+esc(t.id)+'">启用</button>'+
        '<button class="xs danger btn-purge" data-id="'+esc(t.id)+'">清除</button></td></tr>').join('')
      :'<tr><td colspan="4" class="muted">垃圾箱为空</td></tr>';

    const lg=await j('/logs');
    renderLogs(lg.logs||[]);
  }catch(e){ toast('刷新失败: '+e.message); console.error(e) }
}
async function toggle(field){
  const body={}; body[field]=!CFG[field];
  try{ const res=await j('/toggle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); toast(field+' => '+(res.config&&res.config[field])); await refresh() }catch(e){toast(e.message)}
}
async function applyPreset(name){
  if(name==='safe-guard' && !confirm('启用 safe-guard？自动冷却+候选，不自动进垃圾箱。')) return;
  try{ await j('/preset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})}); toast('preset '+name); await refresh() }catch(e){toast(e.message)}
}
async function runTick(){ try{ await j('/run-tick',{method:'POST'}); toast('tick done'); await refresh() }catch(e){toast(e.message)} }
async function restore(id,enable){ try{ await j('/trash/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,enable})}); toast(enable?'恢复并启用':'已恢复'); await refresh() }catch(e){toast(e.message)} }
async function purge(id){ if(!confirm('彻底清除不可恢复？')) return; try{ await j('/trash/purge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,confirm:true})}); toast('已清除'); await refresh() }catch(e){toast(e.message)} }
async function purgeExpired(){ if(!confirm('清除所有到期垃圾箱项？')) return; try{ await j('/trash/purge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expired:true,confirm:true})}); toast('到期项已清'); await refresh() }catch(e){toast(e.message)} }
document.addEventListener('click',function(ev){
  const t=ev.target;
  if(t.classList.contains('btn-restore')) restore(t.getAttribute('data-id'), false);
  if(t.classList.contains('btn-restore-en')) restore(t.getAttribute('data-id'), true);
  if(t.classList.contains('btn-purge')) purge(t.getAttribute('data-id'));
});
const saved=localStorage.getItem(KEY_LS)||''; if(saved) document.getElementById('cfgKey').value=saved;
refresh(); setInterval(refresh,12000);
</script>
</body>
</html>
