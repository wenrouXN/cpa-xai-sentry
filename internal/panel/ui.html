<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>XAI 哨兵</title>
<style>
:root{
  --bg:#eff2f7;--accent:#409eff;--text:#2c3e50;--muted:#8b95a6;--reg:#5f6c7b;
  --card:#fffffff2;--border:#0f172a14;--ok:#67c23a;--warn:#e6a23c;--danger:#f56c6c;
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);color:var(--text);background:linear-gradient(120deg,#f0f7ff,#e7f2ff 50%,#edf7ff);font-size:12.5px}
.wrap{max-width:1680px;margin:0 auto;padding:12px 14px 24px}
.main-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:10px;align-items:start}
@media(max-width:1100px){.main-grid{grid-template-columns:1fr}}
.side-log{position:sticky;top:10px;max-height:calc(100vh - 20px);display:flex;flex-direction:column;margin:0}
.side-log .logbox{flex:1;min-height:280px;max-height:calc(100vh - 110px)}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start;margin-bottom:10px}
h1{font-size:16px;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.eyebrow{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.04em}
.sub{color:var(--muted);font-size:11.5px;margin-top:3px;max-width:920px;line-height:1.45}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid #409eff33;background:#409eff14;color:#337ecc}
.badge.ok{background:#f0f9eb;color:#529b2e;border-color:#c2e7b0}
.badge.warn{background:#fdf6ec;color:#b88230;border-color:#f5dab1}
.badge.danger{background:#fef0f0;color:#c45656;border-color:#fbc4c4}
.badge.off{background:#f4f4f5;color:#909399;border-color:#dcdfe6}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;backdrop-filter:blur(10px)}
.card h2{font-size:12.5px;margin:0 0 8px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{border:1px solid var(--border);border-radius:10px;padding:7px 8px;background:#fff;min-height:56px}
.kpi b{display:block;font-size:18px;line-height:1.1;margin:2px 0;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:10.5px;font-weight:700}
.kpi .subn{display:block;color:var(--muted);font-size:10px;margin-top:2px;font-weight:600}
.kpi.accent{border-color:#409eff55;background:linear-gradient(160deg,#ecf5ff,#fff)}
.kpi.warn{border-color:#e6a23c55;background:linear-gradient(160deg,#fdf6ec,#fff)}
.kpi.danger{border-color:#f56c6c55;background:linear-gradient(160deg,#fef0f0,#fff)}
.kpi.ok{border-color:#67c23a55;background:linear-gradient(160deg,#f0f9eb,#fff)}
button,input,select{font:inherit}
button{appearance:none;border:1px solid var(--border);background:#fff;color:var(--text);border-radius:8px;padding:5px 9px;cursor:pointer;line-height:1.2}
button.primary{background:var(--accent);border-color:#337ecc;color:#fff}
button.warn{background:#fdf6ec;border-color:#f5dab1;color:#b88230}
button.danger{background:var(--danger);border-color:#c45656;color:#fff}
button.xs{padding:3px 7px;font-size:11px;border-radius:7px}
input,select{border:1px solid var(--border);border-radius:8px;padding:5px 8px;background:#fff;min-width:0}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 6px;padding:7px 8px;background:linear-gradient(180deg,#f6faff,#fff);border:1px solid var(--border);border-radius:10px}
.table-wrap{max-height:min(58vh,600px);overflow:auto;border:1px solid var(--border);border-radius:10px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #eef1f5;vertical-align:middle}
th{position:sticky;top:0;background:#f7f9fc;color:#64748b;font-weight:600;font-size:11px;z-index:1;letter-spacing:.02em}
tr:hover td{background:#f5f9ff}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.acc-name{font-size:12px;font-weight:500;color:#1f2937;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.acc-sub{display:none} /* single-line accounts: density goes into columns */
.num-main{font-variant-numeric:tabular-nums;font-weight:600;font-size:12px;color:#1f2937;white-space:nowrap}
.num-sub{display:block;color:#98a2b3;font-size:10.5px;margin-top:1px;white-space:nowrap}
.rate-ok{color:#067647}.rate-mid{color:#b88230}.rate-bad{color:#b42318}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;border:1px solid transparent;background:#f1f5f9;color:#475569;white-space:nowrap;font-weight:600}
.tag.active,.tag.ok{background:#ecfdf3;color:#067647;border-color:#abefc6}
.tag.cooldown,.tag.wait{background:#f2f4f7;color:#344054;border-color:#e4e7ec}
.tag.candidate,.tag.trash{background:#fef3f2;color:#b42318;border-color:#fecdca}
.tag.manual,.tag.review{background:#f4f4f5;color:#606266}
.tag.observe,.tag.none{background:#eff8ff;color:#175cd3;border-color:#b2ddff}
.sigbars{display:inline-flex;align-items:flex-end;gap:1.5px;height:16px;padding:0;cursor:default;user-select:none}
.sigbars .slot{width:3px;height:100%;border-radius:1px;background:#e5e7eb}
.sigbars .slot.on{background:#12b76a}
.sigbars .slot.fail{background:#f04438;cursor:pointer}
.sigbars .slot.fail:hover{filter:brightness(.92)}
.sigbars .slot.empty{background:#eef2f6}
.sigbars.clickable{cursor:pointer}
.quota-main{font-variant-numeric:tabular-nums;font-weight:500;font-size:12px;color:#1f2937;white-space:nowrap}
.quota-sub{display:block;color:#98a2b3;font-size:10.5px;margin-top:2px;white-space:nowrap}
.time-main{font-variant-numeric:tabular-nums;font-weight:500;font-size:12px;color:#344054;white-space:nowrap}
.time-sub{display:none}
.table-wrap.accounts{max-height:min(62vh,680px)}
.table-wrap.accounts th,.table-wrap.accounts td{padding:7px 8px}
.table-wrap.accounts tr td:nth-child(2){min-width:160px;max-width:240px}
.table-wrap.accounts th:nth-child(4),.table-wrap.accounts td:nth-child(4),
.table-wrap.accounts th:nth-child(5),.table-wrap.accounts td:nth-child(5){text-align:right}
.reqcell{display:flex;align-items:center;gap:6px;min-width:78px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--border);background:#fff;border-radius:999px;padding:2px 8px;font-size:11px}
.chip b{color:var(--accent)}
.reason{color:var(--reg);font-size:11px;line-height:1.35;max-width:260px}
.meta{color:var(--muted);font-size:11px}
.actions{display:flex;gap:4px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.tabs button.active{background:var(--accent);border-color:#337ecc;color:#fff}
.help{background:#f5f9ff;border:1px solid #b3d8ff;border-radius:10px;padding:8px 10px;color:#337ecc;font-size:11.5px;line-height:1.5;margin-bottom:8px}
.patrol-box{margin-top:10px;padding:10px;border:1px solid var(--border);border-radius:10px;background:#f8fbff}
.patrol-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start;margin-bottom:8px}
.patrol-head b{font-size:12.5px;margin-right:6px}
.patrol-toggle{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border);background:#fff;border-radius:999px;padding:2px 8px;font-size:11px;color:var(--reg);cursor:pointer}
.patrol-toggle:hover{border-color:#91caff;color:var(--accent)}
.patrol-cfg{display:none;margin-bottom:8px}
.patrol-cfg.open{display:block}
.patrol-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:8px}
@media(max-width:1100px){.patrol-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){.patrol-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.patrol-grid label{display:flex;flex-direction:column;gap:4px;font-size:10.5px;color:var(--muted);font-weight:700}
.patrol-grid input{width:100%}
.patrol-progress{display:none;margin:6px 0 8px}
.patrol-progress.show{display:block}
.patrol-bar-wrap{height:8px;background:#e8eef7;border-radius:999px;overflow:hidden;border:1px solid #d9e4f5}
.patrol-bar{height:100%;width:0%;background:linear-gradient(90deg,#409eff,#66b1ff);transition:width .25s ease}
.patrol-bar-meta{display:flex;justify-content:space-between;gap:8px;margin-top:4px;font-size:11px;color:var(--muted)}
.patrol-log-wrap{display:none}
.patrol-log-wrap.open{display:block}
.patrol-log{max-height:160px;overflow:auto;background:#0b1220;color:#e8eefc;border-radius:8px;padding:8px;font-size:11.5px;line-height:1.45}
.patrol-log .pl{display:grid;grid-template-columns:54px 1fr;gap:8px;padding:3px 0;border-bottom:1px solid #ffffff10}
.patrol-log .pl:last-child{border-bottom:0}
.patrol-log .pt{color:#93a4c3;font-variant-numeric:tabular-nums}
.patrol-log .pm.ok{color:#86efac}.patrol-log .pm.warn{color:#fbbf24}.patrol-log .pm.err{color:#fca5a5}.patrol-log .pm.info{color:#bfdbfe}
#patrolStatus{margin:4px 0 6px}
.toast{position:fixed;right:12px;top:12px;background:#fff;border:1px solid var(--border);padding:8px 12px;border-radius:10px;display:none;box-shadow:0 8px 24px #0f172a1a;z-index:20;max-width:420px}
.logbox{max-height:min(65vh,640px);overflow:auto;background:#0b1220;color:#e8eefc;border-radius:10px;padding:8px 10px;font-family:var(--font);font-size:12px;line-height:1.55}
.logbox .ll{display:grid;grid-template-columns:58px 56px 1fr;gap:8px;align-items:start;padding:6px 2px;border-bottom:1px solid #ffffff0f}
.logbox .ll:last-child{border-bottom:0}
.logbox .lt{color:#93a4c3;font-variant-numeric:tabular-nums;font-size:11.5px;padding-top:2px}
.logbox .lb{display:inline-flex;align-items:center;justify-content:center;min-width:48px;padding:1px 6px;border-radius:999px;font-size:10.5px;font-weight:700;line-height:1.4}
.logbox .lb.ok{background:#12351f;color:#86efac}
.logbox .lb.warn{background:#3a2a10;color:#fbbf24}
.logbox .lb.err{background:#3f1515;color:#fca5a5}
.logbox .lb.info{background:#13233d;color:#93c5fd}
.logbox .lm{color:#e8eefc;word-break:break-word}
.logbox .lm .who{color:#bfdbfe}
.logbox .lm .why{color:#fde68a}
.logbox .empty{color:#93a4c3;padding:12px 4px;text-align:center}
/* real sliding switches */
.swbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}
.sw{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:999px;padding:5px 10px 5px 8px;background:#fff;user-select:none}
.sw .lbl{font-size:11.5px;color:var(--reg);font-weight:600}
.switch{position:relative;width:40px;height:22px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0;position:absolute}
.slider{position:absolute;cursor:pointer;inset:0;background:#dcdfe6;border-radius:999px;transition:.18s}
.slider:before{position:absolute;content:"";height:16px;width:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.18s;box-shadow:0 1px 3px #0003}
.switch input:checked+.slider{background:var(--ok)}
.switch input:checked+.slider:before{transform:translateX(18px)}
.switch.danger input:checked+.slider{background:var(--danger)}
.preset-hint{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.4}
.acc-file{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;color:#64748b;margin-top:2px;word-break:break-all}
.sig-main{font-weight:700;font-size:12px}
.sig-sub{color:var(--muted);font-size:10.5px;margin-top:2px}
.mask-btn.active{background:#ecf5ff;border-color:#b3d8ff;color:#337ecc}
.err-pop{position:fixed;z-index:50;display:none;width:min(560px,calc(100vw - 24px));max-height:min(72vh,560px);overflow:auto;background:#fff;border:1px solid #0f172a18;border-radius:12px;box-shadow:0 18px 50px #0f172a2e;padding:0}
.err-pop.open{display:block}
.err-pop .ep-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#fff,#fafbfc)}
.err-pop .ep-code{font-size:15px;font-weight:800;color:#c45656;display:flex;align-items:center;gap:8px}
.err-pop .ep-code .fail-dot{width:8px;height:8px;border-radius:50%;background:#f56c6c}
.err-pop .ep-sub{color:var(--muted);font-size:12px;margin-top:3px}
.err-pop .ep-close{border:0;background:#f4f4f5;border-radius:8px;width:28px;height:28px;cursor:pointer;font-size:16px;line-height:1}
.err-pop .ep-body{padding:12px 14px}
.err-pop .ep-kv{display:grid;grid-template-columns:72px 1fr;gap:6px 10px;font-size:12px;margin:0 0 10px}
.err-pop .ep-kv b{color:var(--muted);font-weight:600}
.err-pop .ep-json{background:#0b1220;color:#e2e8f0;border-radius:10px;padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.err-pop .ep-msg{color:#fbbf24;font-weight:600;margin-bottom:8px;white-space:pre-wrap}
.policy-log{margin-top:6px;height:168px;overflow:auto;background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:0}
.policy-log table{width:100%;border-collapse:collapse;font-size:11.5px;table-layout:fixed}
.policy-log th,.policy-log td{padding:5px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:28px;line-height:18px}
.policy-log th{position:sticky;top:0;background:#f1f5f9;color:var(--muted);font-weight:700;z-index:1}
.policy-log td:nth-child(3){white-space:nowrap}
.policy-log .pl-empty{color:#94a3b8;padding:12px;text-align:center}
.policy-pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;font-size:11px;color:var(--muted)}
.err-title{font-size:15px;font-weight:800;color:#0f172a;letter-spacing:.2px}
.err-title .err-http{color:#64748b;font-weight:600;font-size:12px;margin-left:6px}
.err-controls label{display:inline-flex;align-items:center;gap:6px}
.err-controls .sw-mini{transform:scale(.85);transform-origin:left center}
.err-actions-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag.danger{background:#fef3f2;color:#b42318;border-color:#fecdca}
.err-card{border:1px solid var(--border);border-radius:12px;background:#fff;padding:10px 12px;margin-bottom:8px}
.err-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.err-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.err-controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:8px;align-items:end;margin-top:10px}
@media(max-width:900px){.err-controls{grid-template-columns:repeat(2,minmax(0,1fr))}}
.err-controls label{display:flex;flex-direction:column;gap:4px;font-size:10.5px;color:var(--muted);font-weight:700}
.err-empty{color:var(--muted);padding:16px;text-align:center}
.tabpanel[hidden]{display:none!important}
select.act{min-width:100px}input.num{width:70px}
.muted{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="eyebrow">xAI 额度哨兵</div>
      <h1>XAI 哨兵 <span id="ver" class="badge">v0.5.12</span> <span id="modeBadge" class="badge">模式</span></h1>
    </div>
    <div class="row" style="align-items:center;flex-wrap:wrap">
      <label class="sw" title="关=不再自动处理；开=按下方开关执行">
        <span class="lbl">总开关</span>
        <span class="switch"><input id="swSentry" type="checkbox" onchange="toggle('sentry_enabled',this.checked)"/><span class="slider"></span></span>
      </label>
      <label class="sw" title="额度/消费类错误自动冷却"><span class="lbl">自动冷却</span>
        <span class="switch"><input id="swCool" type="checkbox" onchange="toggle('auto_cooldown',this.checked)"/><span class="slider"></span></span>
      </label>
      <label class="sw" title="凭证类错误自动进候选"><span class="lbl">自动候选</span>
        <span class="switch"><input id="swCand" type="checkbox" onchange="toggle('auto_candidate',this.checked)"/><span class="slider"></span></span>
      </label>
      <label class="sw" title="确认后自动进垃圾箱"><span class="lbl">自动垃圾箱</span>
        <span class="switch danger"><input id="swDel" type="checkbox" onchange="toggle('auto_delete',this.checked)"/><span class="slider"></span></span>
      </label>
      <input id="cfgKey" type="password" placeholder="管理密钥" style="width:130px"/>
      <button class="xs" onclick="saveKey()">保存</button>
      <button class="xs mask-btn" id="maskBtn" onclick="toggleMask()" title="切换账号脱敏/完整显示">脱敏</button>
      <button class="xs" onclick="refresh()">刷新</button>
    </div>
  </div>

  <div class="card">
    <h2><span>总览</span><span class="meta" id="updatedAt">-</span></h2>
    <div class="kpis" id="kpis"></div>
    <div class="swbar">
      <span class="meta" id="cfgLine"></span>
      <button class="xs" onclick="applyPreset('observe')" title="关闭自动冷却/候选/垃圾箱，只记录观察">仅观察</button>
      <button class="xs warn" onclick="applyPreset('safe-guard')" title="打开自动冷却+自动候选；不会自动进垃圾箱">安全防护</button>
      <button class="xs" onclick="runTick()" title="被动维护：恢复到期冷却 + 同步 CPA 已禁用账号到哨兵冷却状态 + 清理过期垃圾箱（不主动探测，不消耗额度）">立即维护</button>
    </div>
    <div class="patrol-box">
      <div class="patrol-head">
        <div>
          <b>巡查中心</b>
          <span class="meta">定时巡查 + 手动巡查合在一起 · 会真实请求 xAI，消耗免费额度</span>
          <div class="meta" id="patrolSchedule" style="margin-top:3px">上次：- · 下次：-</div>
        </div>
        <div class="row">
          <label class="sw" title="开启后按周期自动巡查（会消耗额度）" style="margin:0">
            <span class="lbl">定时巡查</span>
            <span class="switch"><input id="swPatrol" type="checkbox" onchange="toggle('patrol_enabled',this.checked)"/><span class="slider"></span></span>
          </label>
          <button class="xs primary" onclick="patrolStart('full')" title="只探测当前已启用的 xAI 账号">手动全量</button>
          <button class="xs warn" onclick="patrolStart('cooldown')" title="只探测当前冷却中的账号">手动查冷却</button>
          <button type="button" class="patrol-toggle" id="btnPatrolCfg" onclick="togglePatrolCfg()" title="展开/收起巡查参数">配置 ▾</button>
          <button type="button" class="patrol-toggle" id="btnPatrolLog" onclick="togglePatrolLog()" title="显示/隐藏巡查日志">日志 ▾</button>
        </div>
      </div>
      <div class="patrol-cfg" id="patrolCfgPanel">
        <div class="patrol-grid">
          <label>周期(秒)<input id="pInterval" type="number" min="60" step="60" value="3600"/></label>
          <label>超时(秒)<input id="pTimeout" type="number" min="3" step="1" value="15"/></label>
          <label>并发<input id="pConc" type="number" min="1" max="64" step="1" value="8"/></label>
          <label>每轮上限<input id="pBatch" type="number" min="0" step="1" value="50"/></label>
          <label>模型<input id="pModel" type="text" value="grok-4.5"/></label>
          <label>代理URL<input id="pProxy" type="text" placeholder="可选 http://..."/></label>
        </div>
        <div class="row" style="margin-top:4px">
          <button class="xs" onclick="savePatrolCfg()" title="保存巡查参数">保存巡查配置</button>
          <span class="meta">默认收起，改完记得保存</span>
        </div>
      </div>
      <div class="meta" id="patrolStatus">空闲</div>
      <div class="patrol-progress" id="patrolProgress">

<script>
let CFG={}, timer=null, LAST_LOGS=[], LAST_ACCOUNTS=[], ERRORS=[], CURRENT_TAB='accounts';
let ERR_RENDERED=false, ERR_SNAPSHOT='';
let MASKED = localStorage.getItem('cpa-xai-sentry-mask') !== '0'; // default masked like CPAMP
const SIG_ZH={free_usage_429:'免费额度用尽',spending_limit_402:'消费限额',auth_401:'凭证失效',permission_403:'权限拒绝',http_404:'HTTP 404', 'code:invalid-argument':'参数无效/上下文过长'};
const API="/v0/management/cpa-xai-sentry";
const KEY_LS="cpa-xai-sentry-management-key";
const STATE_ZH={active:'正常',cooldown_quota:'429·额度冷却',cooldown_spending:'402·消费冷却',cooldown_permission:'403·权限冷却',candidate_dead:'401·候删',user_manual:'手动禁用',trashed:'垃圾箱',purged:'已清除'};
const ACT_ZH={observe:'仅观察',cooldown:'冷却',candidate:'候删',trash:'进垃圾箱',wait:'等待恢复',review:'复查',manual:'禁用',none:'无',restore_or_purge:'恢复/清除'};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
// CPAMP-style mask: local part >8 => abc***wxyz@domain
function maskEmail(email){
  const n=String(email||'').trim();
  if(!n) return '-';
  const at=n.indexOf('@');
  if(at<=0) return maskToken(n);
  const r=n.slice(0,at), i=n.slice(at);
  if(r.length<=8) return n;
  return r.slice(0,3)+'***'+r.slice(-4)+i;
}
function maskToken(s){
  const n=String(s||'');
  if(n.length<=8) return n;
  return n.slice(0,3)+'***'+n.slice(-4);
}
function dispName(a){
  const full=a.display_name||a.email||a.file_name||a.auth_index||'-';
  return MASKED ? maskEmail(full) : full;
}
function dispAuth(s){ return MASKED ? maskEmail(s) : (s||'-'); }
function syncMaskBtn(){
  const b=document.getElementById('maskBtn');
  if(!b) return;
  b.textContent = MASKED ? '脱敏' : '完整';
  b.classList.toggle('active', !!MASKED);
  b.title = MASKED ? '当前脱敏显示，点击显示完整账号' : '当前完整显示，点击脱敏账号';
}
function toggleMask(){
  MASKED = !MASKED;
  localStorage.setItem('cpa-xai-sentry-mask', MASKED ? '1' : '0');
  syncMaskBtn();
  // re-render from cache without full network roundtrip when possible
  if(LAST_ACCOUNTS && LAST_ACCOUNTS.length){
    const prevSel=new Set(selectedAuths());
    document.getElementById('accBody').innerHTML=renderAccountRows(LAST_ACCOUNTS, prevSel);
  }
  renderLogs(LAST_LOGS||[]);
  if(CURRENT_TAB==='errors'){ ERR_RENDERED=false; renderErrorCards(ERRORS||[], true); }
  if(CURRENT_TAB==='trash') refreshTrashOnly();
  toast(MASKED ? '已切换为脱敏显示' : '已切换为完整显示');
}
function getKey(){return (document.getElementById('cfgKey').value||localStorage.getItem(KEY_LS)||'').trim()}
function saveKey(){const k=document.getElementById('cfgKey').value.trim(); if(k) localStorage.setItem(KEY_LS,k); else localStorage.removeItem(KEY_LS); toast(k?'密钥已保存':'已清除密钥'); refresh()}
async function j(path, opt){
  opt=opt||{}; const headers=Object.assign({},opt.headers||{});
  const k=getKey(); if(k){headers['X-Management-Key']=k; headers['Authorization']='Bearer '+k}
  const url=path.startsWith('/')?API+path:API+'/'+path;
  const r=await fetch(url,Object.assign({},opt,{headers}));
  const text=await r.text(); let data; try{data=JSON.parse(text)}catch(e){data={raw:text}}
  if(!r.ok) throw new Error((data&&data.error)||text||('HTTP '+r.status));
  if(data&&data.ok===true&&data.result!=null){
    if(typeof data.result==='object'&&data.result.Body!=null){
      try{const body=typeof data.result.Body==='string'?data.result.Body:new TextDecoder().decode(new Uint8Array(data.result.Body)); return JSON.parse(body)}catch(e){return data.result}
    }
    if(typeof data.result==='string'){try{return JSON.parse(data.result)}catch(e){return data}}
    return data.result;
  }
  return data;
}
function modeBadge(mode,label){
  const el=document.getElementById('modeBadge'); el.className='badge';
  if(mode==='observe') el.classList.add('ok');
  else if(mode==='safe-guard'||mode==='cooldown') el.classList.add('warn');
  else if(mode==='auto_trash') el.classList.add('danger');
  else el.classList.add('off');
  el.innerHTML='<span class="dot"></span>'+esc(label||mode||'-');
}
function setSwitch(id,on){const el=document.getElementById(id); if(el) el.checked=!!on}
function tag(cls,text){return '<span class="tag '+cls+'">'+esc(text)+'</span>'}
function stateLabel(st, a){
  // 状态码 + 执行动作（一句话）
  a=a||{};
  const sig=a.last_signal||'';
  if(st==='active') return {text:'正常', cls:'active', tip:'正常可用'};
  if(st==='cooldown_quota') return {text:'429·额度冷却', cls:'cooldown', tip:'HTTP 429 免费额度用尽 → 冷却'};
  if(st==='cooldown_spending') return {text:'402·消费冷却', cls:'cooldown', tip:'HTTP 402 消费限额 → 冷却'};
  if(st==='cooldown_permission') return {text:'403·权限冷却', cls:'cooldown', tip:'HTTP 403 权限拒绝 → 冷却'};
  if(st==='candidate_dead') return {text:'401·候删', cls:'candidate', tip:'HTTP 401 凭证失效 → 候删/候选'};
  if(st==='user_manual'){
    if(a.disable_source==='cpa_file_disabled' || a.disable_source==='cpa_disabled')
      return {text:'CPA已禁用', cls:'manual', tip:'CPA凭证文件 disabled（非面板手动点禁用）'};
    return {text:'手动禁用', cls:'manual', tip:'面板手动禁用'};
  }
  if(st==='trashed') return {text:'垃圾箱', cls:'trash', tip:'已进垃圾箱，可恢复'};
  if(st==='purged') return {text:'已清除', cls:'trash', tip:'已彻底清除'};
  // fallback by signal when state not specific
  if(sig==='free_usage_429') return {text:'429·额度冷却', cls:'cooldown', tip:sig};
  if(sig==='spending_limit_402') return {text:'402·消费冷却', cls:'cooldown', tip:sig};
  if(sig==='permission_403') return {text:'403·权限冷却', cls:'cooldown', tip:sig};
  if(sig==='auth_401') return {text:'401·候删', cls:'candidate', tip:sig};
  return {text: STATE_ZH[st]||st||'-', cls:'', tip:st||''};
}
function stateTag(st, a){
  const s=stateLabel(st, a);
  // single line only: 状态码+动作，避免看起来像两行账号
  return '<span class="tag '+s.cls+'" title="'+esc(s.tip)+'">'+esc(s.text)+'</span>';
}
function actionTag(a){const cls=({cooldown:'cooldown',candidate:'candidate',trash:'trash',wait:'wait',review:'review',manual:'manual',observe:'observe',none:'none',restore_or_purge:'trash'}[a]||''); return tag(cls, ACT_ZH[a]||a||'-')}
function switchTab(name){
  CURRENT_TAB=name;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  ['accounts','errors','trash'].forEach(n=>{
    const el=document.getElementById('tab-'+n);
    if(el) el.hidden=(n!==name);
  });
  if(name==='errors') loadErrors(!ERR_RENDERED);
  if(name==='trash') refreshTrashOnly();
  // logs always visible on the right
  renderLogs(LAST_LOGS);
}
function debouncedRefresh(){clearTimeout(timer); timer=setTimeout(refresh,220)}
function fmtTok(n){
  n=Number(n)||0; if(n<0) n=-n;
  if(n>=1e6){ const w=Math.floor(n/1e6), f=Math.floor((n%1e6)/1e5); return f? (w+'.'+f+'M') : (w+'M'); }
  if(n>=1e4) return Math.floor(n/1000)+'k';
  return String(n);
}
function renderKPIs(s, trashCount, cool, inv, usage){
  s=s||{}; cool=cool||{}; inv=inv||{}; usage=usage||{};
  const cooling=cool.cooling!=null?cool.cooling:(s.cooldown||0);
  const xai=inv.auth_xai!=null?inv.auth_xai:(inv.auth_total||0);
  const items=[
    ['可接流量', inv.auth_enabled!=null?inv.auth_enabled:0, 'ok', '已开启'],
    ['冷却中', cooling, 'warn', '到期恢复'],
    ['xAI 总量', xai, '', '含冷却'],
    ['日池总量', fmtTok(usage.pool_est||0), 'accent', '全量×2M'],
    ['日池已用', fmtTok(usage.pool_used||0), 'warn', (usage.pool_used_pct!=null? (Number(usage.pool_used_pct).toFixed(1)+'%') : '')],
    ['日池剩余', fmtTok(usage.pool_remaining||0), 'ok', ''],
  ];
  document.getElementById('kpis').innerHTML=items.map(([l,v,c,sub])=>
    '<div class="kpi '+(c||'')+'"><span>'+l+'</span><b>'+v+'</b>'+(sub?('<span class="subn">'+esc(sub)+'</span>'):'')+'</div>'
  ).join('');
}
function accountCell(a){
  const name=dispName(a);
  const title=a.display_name||a.email||a.auth_index||'';
  // single-line only — density lives in dedicated columns
  return '<div class="acc-name" title="'+esc(title)+'">'+esc(name)+'</div>';
}
function totalCallsCell(a){
  const tot=Number(a.total_calls!=null?a.total_calls:a.day_calls||0);
  const day=Number(a.day_calls||0);
  if(!tot && !day) return '<div class="num-main">-</div>';
  let html='<div class="num-main">'+tot+'</div>';
  if(day>0 && day!==tot) html+='<div class="num-sub">今日 '+day+'</div>';
  return html;
}
function rateCell(a){
  const tot=Number(a.total_calls!=null?a.total_calls:0);
  const day=Number(a.day_calls||0);
  let rate=a.success_rate;
  if(rate==null){
    const ok=Number(a.total_success!=null?a.total_success:(a.day_success!=null?a.day_success:Math.max(0,day-Number(a.day_fail_calls||0))));
    const base=tot||day;
    rate=base>0?(ok/base*100):null;
  }
  if(rate==null || (!(tot||day))) return '<div class="num-main">-</div>';
  const n=Number(rate);
  const cls=n>=90?'rate-ok':(n>=70?'rate-mid':'rate-bad');
  let html='<div class="num-main '+cls+'">'+n.toFixed(0)+'%</div>';
  if(a.day_success_rate!=null && day>0 && tot>day){
    html+='<div class="num-sub">今日 '+Number(a.day_success_rate).toFixed(0)+'%</div>';
  }
  return html;
}
function callsCell(a){
  // 最近15次真实请求：从右到左为新→旧；不足15时左边留灰
  const slots=15;
  let seq=Array.isArray(a.recent15)?a.recent15.slice(-slots):[];
  // seq is oldest→newest; right-align into 15 slots (left empty gray)
  const parts=[];
  const pad=slots-seq.length;
  for(let i=0;i<slots;i++){
    let cls='empty';
    if(i>=pad){
      const v=seq[i-pad];
      cls = v ? 'on' : 'fail';
    }
    parts.push('<i class="slot '+cls+'"></i>');
  }
  const fail = seq.filter(x=>x===false).length;
  const ok = seq.filter(x=>x===true).length;
  const clickable = fail>0 ? ' clickable' : '';
  const wrapClick = fail>0 ? ' data-auth="'+esc(a.auth_index)+'" onclick="openAccountError(this)"' : '';
  const title = seq.length
    ? ('最近'+seq.length+'次（右新左旧）· 成'+ok+' 败'+fail+(fail>0?' · 点红格看报错':''))
    : '暂无请求记录';
  return '<div class="reqcell"><div class="sigbars'+clickable+'"'+wrapClick+' title="'+esc(title)+'">'+parts.join('')+'</div></div>';
}
function totalTokensCell(a){
  const tot=Number(a.total_tokens||0);
  if(!tot) return '<div class="num-main">-</div>';
  return '<div class="num-main" title="历史累计 token">'+esc(fmtTok(tot))+'</div>';
}
function dayTokensCell(a){
  const day=Number(a.day_tokens||0);
  if(!day) return '<div class="num-main">-</div>';
  return '<div class="num-main" title="今日 token">'+esc(fmtTok(day))+'</div>';
}
function quotaRatioCell(a){
  // 今日用量 / 24h额度 → 百分比
  const day=Number(a.day_tokens||0);
  let lim=Number(a.quota_limit||0);
  if(lim<=0) lim=2000000; // free-tier 24h estimate
  // prefer explicit used from free-usage body when day tokens missing
  let used=day>0?day:Number(a.quota_used||0);
  if(!used || !lim){
    if(a.state && String(a.state).indexOf('cooldown')>=0){
      return '<div class="num-main rate-bad" title="额度冷却/用尽">100%</div>';
    }
    return '<div class="num-main">-</div>';
  }
  let pct=used/lim*100;
  if(pct<0) pct=0;
  // allow >100% when actual exceeds free limit
  const cls=pct>=100?'rate-bad':(pct>=80?'rate-mid':'rate-ok');
  const txt=(pct>=100 && pct<1000)?pct.toFixed(0):(pct>=10?pct.toFixed(0):pct.toFixed(1));
  const tip='今日 '+fmtTok(used)+' / 24h额度 '+fmtTok(lim)+' = '+txt+'%';
  return '<div class="num-main '+cls+'" title="'+esc(tip)+'">'+esc(txt+'%')+'</div>';
}
function renderAccountRows(list, prevSel){
  prevSel=prevSel||new Set();
  const rows=list||[];
  if(!rows.length) return '<tr><td colspan="11" class="muted">无匹配结果</td></tr>';
  return rows.map(a=>'<tr>'+
    '<td><input type="checkbox" class="rowchk" data-auth="'+esc(a.auth_index)+'"'+(prevSel.has(a.auth_index)?' checked':'')+'/></td>'+
    '<td>'+accountCell(a)+'</td>'+
    '<td>'+stateTag(a.state, a)+'</td>'+
    '<td>'+totalCallsCell(a)+'</td>'+
    '<td>'+rateCell(a)+'</td>'+
    '<td>'+callsCell(a)+'</td>'+
    '<td>'+totalTokensCell(a)+'</td>'+
    '<td>'+dayTokensCell(a)+'</td>'+
    '<td>'+quotaRatioCell(a)+'</td>'+
    '<td>'+updatedCell(a.updated_at)+'</td>'+
    '<td>'+timeCell(a.recover_at)+'</td></tr>').join('');
}
function httpCodeOf(sig){
  if(sig==='free_usage_429') return '429';
  if(sig==='spending_limit_402') return '402';
  if(sig==='auth_401') return '401';
  if(sig==='permission_403') return '403';
  return '';
}
function shortSignal(sig){
  return httpCodeOf(sig) || (sig && sig.length>12?sig.slice(0,12)+'…':(sig||''));
}
function cleanSample(raw){
  let s=decodeEntities(raw||'').trim();
  // sometimes double-encoded or quoted
  if((s.startsWith('"') && s.endsWith('"')) || (s.startsWith("'") && s.endsWith("'"))){
    try{s=JSON.parse(s)}catch(e){s=s.slice(1,-1)}
  }
  s=decodeEntities(String(s||''));
  return s;
}
function parseErrorBody(raw){
  const s=cleanSample(raw);
  const out={code:'', message:'', tokens:'', pretty:s, http:''};
  if(!s) return out;
  try{
    const obj=JSON.parse(s);
    out.pretty=JSON.stringify(obj,null,2);
    out.code=obj.code||(obj.error&&obj.error.code)||'';
    out.message=obj.error||obj.message||(obj.error&&obj.error.message)||'';
    if(typeof out.message==='object') out.message=out.message.message||JSON.stringify(out.message);
    // tokens actual/limit from message text
    const m=String(out.message||s).match(/tokens?\s*\(actual\/limit\):\s*(\d+)\s*\/\s*(\d+)/i);
    if(m) out.tokens=m[1]+' / '+m[2];
    return out;
  }catch(e){}
  const m=s.match(/tokens?\s*\(actual\/limit\):\s*(\d+)\s*\/\s*(\d+)/i);
  if(m) out.tokens=m[1]+' / '+m[2];
  out.message=s.split(/[\n\r]/)[0].slice(0,200);
  out.pretty=s;
  return out;
}
function findAccountByAuth(auth){
  return (LAST_ACCOUNTS||[]).find(a=>a.auth_index===auth) || null;
}
function openAccountError(el){
  // accept button/slot/sigbars wrapper
  const auth = el.getAttribute('data-auth') || (el.closest && el.closest('[data-auth]') && el.closest('[data-auth]').getAttribute('data-auth'));
  const a=findAccountByAuth(auth);
  if(!a){ toast('找不到账号详情'); return; }
  const sig=a.last_signal||'';
  const http=httpCodeOf(sig)||'ERR';
  const err=(ERRORS||[]).find(e=>e.key===sig) || {};
  const body=parseErrorBody(err.sample||err.sample_pretty||'');
  const fullName=a.display_name||a.email||a.auth_index||'-';
  const name=MASKED?maskEmail(fullName):fullName;
  const title='HTTP '+http;
  const sub=(SIG_ZH[sig]||sig||'失败')+(sig?(' · '+sig):'');

    (a.day_tokens?('<b>token</b><span>'+esc(fmtTok(a.day_tokens))+(a.day_input_tokens||a.day_output_tokens?('（入'+fmtTok(a.day_input_tokens||0)+' / 出'+fmtTok(a.day_output_tokens||0)+'）'):'')+'</span>'):'')+
    ((a.quota_used||a.quota_limit)?('<b>额度</b><span>'+esc(fmtTok(a.quota_used||0)+' / '+fmtTok(a.quota_limit||0))+'</span>'):'')+

function decodeEntities(s){
  if(!s) return '';
  const t=document.createElement('textarea'); t.innerHTML=String(s); return t.value;
}
function formatErrorSample(raw){
  let s=decodeEntities(raw||'').trim();
  if(!s) return {msg:'暂无样本', pretty:''};
  // try JSON pretty
  try{
    const obj=JSON.parse(s);
    const msg=obj.error||obj.message||(obj.error&&obj.error.message)||obj.code||'';
    const code=obj.code||(obj.error&&obj.error.code)||'';
    let head='';
    if(code) head+=String(code);
    if(msg && String(msg)!==String(code)) head+=(head?' · ':'')+String(msg);
    return {msg: head||'错误样本', pretty: JSON.stringify(obj,null,2)};
  }catch(e){}
  // key:value fragments
  if(s.length>400) s=s.slice(0,400)+'...';
  return {msg:s.split(/[\n\r]/)[0].slice(0,160), pretty:s};
}
function renderLogs(logs){
  LAST_LOGS=logs||[];
  const box=document.getElementById('logbox');
  if(!box) return;
  // filter logs by current account search/state selection when possible
  const q=(document.getElementById('q')?.value||'').trim().toLowerCase();
  const stf=(document.getElementById('stateFilter')?.value||'').trim();
  const accKeys=new Set();
  (LAST_ACCOUNTS||[]).forEach(a=>{
    if(a.auth_index) accKeys.add(String(a.auth_index).toLowerCase());
    if(a.email) accKeys.add(String(a.email).toLowerCase());
    if(a.file_name) accKeys.add(String(a.file_name).toLowerCase());
    if(a.display_name) accKeys.add(String(a.display_name).toLowerCase());
  });
  let src=LAST_LOGS.slice().reverse();
  if(q || stf){
    src=src.filter(e=>{
      const who=String(e.auth_label||e.auth||'').toLowerCase();
      const auth=String(e.auth||'').toLowerCase();
      const text=String(e.text||'').toLowerCase();
      // if we have filtered accounts, keep logs that match those accounts OR global patrol/tick
      if(accKeys.size){
        const hit=[...accKeys].some(k=>k && (who.includes(k)||auth.includes(k)||text.includes(k)));
        if(hit) return true;
        // keep global maintenance/patrol lines when searching those keywords
        if(q && (text.includes(q) || String(e.source||'').includes(q) || String(e.action||'').includes(q))) return true;
        // if account filter active, drop unrelated account logs
        if(e.auth || e.auth_label) return false;
        return !q; // keep generic when only state filter
      }
      if(!q) return true;
      return who.includes(q) || auth.includes(q) || text.includes(q) || String(e.action||'').includes(q) || String(e.source||'').includes(q);
    });
  }
  const lines=src.slice(0,300).map(e=>{
    const level=e.level || (String(e.action||'').includes('fail')||String(e.action||'').includes('error')?'err'
      :(e.action==='cooldown'||e.action==='candidate'||e.action==='trash'||e.action==='delete'||e.action==='manual_disable'?'warn'
      :(e.action==='reenable'||e.action==='manual_enable'||e.action==='backfill'||e.action==='auto_backfill'||e.action==='patrol_done'?'ok':'info')));
    const badge=e.action_label||ACT_ZH[e.action]||e.action||'事件';
    let text=e.text || '';
    if(!text || (text.indexOf(' · ')>=0 && text.split(' · ').length>=3 && !/因|已将|已恢复|失败|巡查|维护/.test(text))){
      text=composeLogClient(e);
    }
    const htmlText=esc(text).replace(/([a-z0-9._%+\-*]+@[a-z0-9.\-*]+\.[a-z*]{2,})/ig,'<span class="who">$1</span>');
    return '<div class="ll">'+
      '<div class="lt">'+esc(e.at||'')+'</div>'+
      '<div><span class="lb '+level+'">'+esc(badge)+'</span></div>'+
      '<div class="lm">'+htmlText+'</div>'+
    '</div>';
  });
  box.innerHTML=lines.join('')||'<div class="empty">暂无匹配日志</div>';
  const meta=document.getElementById('logMeta');
  if(meta) meta.textContent=(lines.length||0)+'/'+(LAST_LOGS.length||0)+' 条'+(MASKED?' · 脱敏':'')+(q||stf?' · 已筛选':'');
}
function composeLogClient(e){
  const act=e.action||'';
  const who=dispAuth(e.auth_label||e.auth||'');
  const why=e.reason||e.signal_label||SIG_ZH[e.signal]||e.signal||'';
  if(act==='cooldown') return why?('因'+why+'，已将 '+(who||'账号')+' 转入冷却'):('已将 '+(who||'账号')+' 转入冷却');
  if(act==='reenable') return why?(why+'，已恢复启用 '+(who||'账号')):('已恢复启用 '+(who||'账号'));
  if(act==='candidate') return why?('因'+why+'，已将 '+(who||'账号')+' 移入候选'):('已将 '+(who||'账号')+' 移入候选');
  if(act==='trash'||act==='delete') return why?('因'+why+'，已将 '+(who||'账号')+' 移入垃圾箱'):('已将 '+(who||'账号')+' 移入垃圾箱');
  if(act==='file_disabled_sync') return '维护发现 CPA 凭证文件已禁用，已将 '+(who||'账号')+' 标记为「CPA已禁用」（不是你点的）';
  if(act==='manual_disable') return '已在面板手动禁用 '+(who||'账号');
  if(act==='manual_enable') return '已在面板手动启用 '+(who||'账号');
  if(act==='cooldown_failed') return '冷却 '+(who||'账号')+' 失败'+(why?('：'+why):'');
  if(act==='reenable_failed') return '恢复启用 '+(who||'账号')+' 失败'+(why?('：'+why):'');
  if(act==='backfill'||act==='auto_backfill') return why||'已回补今日用量数据';
  const actL=e.action_label||ACT_ZH[act]||act||'事件';
  return [actL, who, why].filter(Boolean).join(' · ');
}

function policyErrorRows(key){
  // Prefer backend account_hits (has source/streak). Fallback to action logs.
  const err=(ERRORS||[]).find(e=>e.key===key)||{};
  const hits=Array.isArray(err.account_hits)?err.account_hits:[];
  if(hits.length){
    return hits.map(h=>({
      auth:h.auth,
      label:h.label||h.auth,
      lastAt:h.last_at||'',
      reason:h.message||h.sample||'',
      req:h.hits||0,
      fail:h.hits||0,
      hits:h.hits||0,
      streak:h.streak||0,
      source:h.source_label||h.source||'',
      status:h.status||0,
    }));
  }
  const known=new Set(Object.keys(SIG_ZH));
  const logs=(LAST_LOGS||[]).filter(l=>{
    const sig=l.signal||'';
    if(key==='unmatched') return !sig || !known.has(sig) || (l.text||'').toLowerCase().includes('unexpected eof') || (l.text||'').includes('CPA');
    if(key==='http_404') return (l.text||'').includes('404') || sig==='http_404';
    if(key==='code:invalid-argument') return (l.text||'').toLowerCase().includes('invalid-argument') || (l.reason||'').toLowerCase().includes('invalid');
    return sig===key || (l.text||'').includes(key);
  });
  const by={};
  logs.forEach(l=>{
    const id=l.auth||l.auth_label||'';
    if(!id) return;
    if(!by[id]) by[id]={auth:id, label:l.auth_label||l.auth||id, lastAt:l.at||'', reason:l.reason||l.signal_label||l.text||'', hits:0, streak:0, source:l.source_label||l.source||''};
    by[id].hits++;
    if((l.at||'') >= (by[id].lastAt||'')) {
      by[id].lastAt=l.at||by[id].lastAt;
      by[id].reason=l.reason||l.signal_label||l.text||by[id].reason;
      by[id].source=l.source_label||l.source||by[id].source;
    }
  });
  Object.values(by).forEach(r=>{
    const acc=(LAST_ACCOUNTS||[]).find(a=>a.auth_index===r.auth || a.email===r.label || a.display_name===r.label);
    if(acc){
      r.label=acc.display_name||acc.email||r.label;
      r.req=acc.day_calls||0;
      r.fail=acc.day_fail_calls||0;
      if(acc.streaks && (acc.streaks[key]!=null)) r.streak=acc.streaks[key];
      else if(acc.last_signal===key) r.streak=1;
    }else{
      r.req=r.hits; r.fail=r.hits;
    }
  });
  if(!Object.keys(by).length){
    (LAST_ACCOUNTS||[]).filter(a=>a.last_signal===key).forEach(a=>{
      const streak=(a.streaks&&a.streaks[key])||1;
      by[a.auth_index]={auth:a.auth_index,label:a.display_name||a.email,lastAt:a.updated_at||'',reason:(SIG_ZH[key]||key)+'（账号当前信号）',req:a.day_calls||0,fail:a.day_fail_calls||0,hits:a.day_fail_calls||0,streak:streak,source:'账号状态'};
    });
  }
  return Object.values(by).sort((a,b)=>(b.lastAt||'').localeCompare(a.lastAt||''));
}

      '<button class="xs" '+(page>=pages?'disabled':'')+' onclick="setPolicyPage(\''+esc(key)+'\','+(page+1)+')">下一页</button>'+
    '</span></div>';
  return head+table+pager;
}

        '<label class="sw" title="是否启用该错误策略"><span class="lbl">启用</span><span class="switch"><input class="en-sw" type="checkbox" '+(e.enabled?'checked':'')+' onchange="quickSaveError(\''+esc(e.key)+'\')"/><span class="slider"></span></span></label>'+
        '<label>动作<select class="act" onchange="quickSaveError(\''+esc(e.key)+'\')">'+['observe','cooldown','candidate','trash'].map(a=>'<option value="'+a+'"'+(e.action===a?' selected':'')+'>'+(ACT_ZH[a]||a)+'</option>').join('')+'</select></label>'+
        '<label>连续N<input class="num th" type="number" min="1" value="'+(e.threshold||1)+'" onchange="quickSaveError(\''+esc(e.key)+'\')"/></label>'+
        '<label>冷却秒<input class="num cd" type="number" min="0" value="'+(e.cooldown_seconds||0)+'" onchange="quickSaveError(\''+esc(e.key)+'\')"/></label>'+
        '<button class="xs primary" data-key="'+esc(e.key)+'" onclick="saveErrorKey(this.getAttribute(\'data-key\'))">保存</button>'+
      '</div>'+
      '<div class="err-actions-row">'+
        (canSplit?'<button class="xs" onclick="splitUnmatched()">从「未分类」拆成分类…</button>':'')+
        (canUnclass?'<button class="xs warn" onclick="unclassifyError(\''+esc(e.key)+'\')">取消分类→未分类</button>':'')+
      '</div>'+
      '<div class="meta" style="margin-top:8px;font-weight:700;color:#334155">报错日志</div>'+
      '<div class="policy-log" data-f="plog">'+policyLogsHTML(e.key)+'</div>'+
    '</div>';
  }).join('');
}
async function loadErrors(force){
  try{
    const res=await j('/errors');
    ERRORS=res.errors||[];
    document.getElementById('errMeta').textContent=ERRORS.length+' 种'+(force||!ERR_RENDERED?'':' · 静默刷新');
    renderErrorCards(ERRORS, !!force);
  }catch(e){ toast('加载错误目录失败：'+e.message) }
}
async function saveErrorKey(key, silent){
  const e=(ERRORS||[]).find(x=>x.key===key); if(!e) return;
  const card=document.querySelector('.err-card[data-key="'+CSS.escape(key)+'"]');
  if(!card){ toast('找不到错误卡片'); return; }
  const enSw=card.querySelector('.en-sw');
  const enabled=enSw?!!enSw.checked:!!e.enabled;
  const action=card.querySelector('.act').value;
  const threshold=parseInt(card.querySelector('.th').value||'1',10);
  const cooldown=parseInt(card.querySelector('.cd').value||'0',10);
  const note=e.note||'';
  const never=!!e.never_trash;
  try{
    await j('/errors/policy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      key:e.key,label:e.label,enabled,action,threshold,cooldown_seconds:cooldown,never_trash:never,note,source:e.source||'user'
    })});
    if(!silent) toast('已保存: '+(e.label||e.key));
    e.enabled=enabled; e.action=action; e.threshold=threshold; e.cooldown_seconds=cooldown;
    ERR_RENDERED=false;
    await loadErrors(true);
  }catch(err){ toast(err.message) }
}
async function quickSaveError(key){ return saveErrorKey(key, true); }
async function unclassifyError(key){
  if(!key || key==='unmatched') return;
  if(!confirm('把「'+(key)+'」整类移入「未分类错误」？')) return;
  try{
    await j('/errors/reclassify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:key,to:'unmatched',label:'未分类错误'})});
    toast('已取消分类');
    ERR_RENDERED=false; await loadErrors(true);
  }catch(e){ toast(e.message) }
}
async function splitUnmatched(){
  const to=prompt('把「未分类」拆成新分类 key（如 code:foo 或 http_418）');
  if(!to) return;
  const label=prompt('新分类显示名', to)||to;
  try{
    await j('/errors/reclassify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:'unmatched',to:to.trim(),label:label.trim()})});
    toast('已拆分为 '+to);
    ERR_RENDERED=false; await loadErrors(true);
  }catch(e){ toast(e.message) }
}
async function purgeAllTrash(){
  if(!confirm('确定清空垃圾箱全部条目？不可恢复！')) return;
  try{
    const tr=await j('/trash');
    const items=tr.trash||[];
    let ok=0, fail=0;
    for(const it of items){
      try{ await j('/trash/purge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:it.id,confirm:true})}); ok++; }
      catch(e){ fail++; }
    }
    toast('清空完成 成功'+ok+' 失败'+fail);
    await refresh();
  }catch(e){ toast(e.message) }
}
async function saveError(i){
  const e=ERRORS[i]; if(e) return saveErrorKey(e.key);
}
async function toggle(field, checked){
  const body={}; body[field]=!!checked;
  try{
    const res=await j('/toggle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    toast((field)+' => '+(res.config&&res.config[field]?'开':'关'));
    await refresh();
  }catch(e){
    toast(e.message);
    // revert switch on failure
    setSwitch({
      sentry_enabled:'swSentry', auto_cooldown:'swCool', auto_candidate:'swCand',
      auto_delete:'swDel', patrol_enabled:'swPatrol'
    }[field], !checked);
  }
}
async function applyPreset(name){
  if(name==='safe-guard' && !confirm('启用「安全防护」?\n\n将打开:自动冷却 + 自动候选\n不会:自动进垃圾箱\n\n适合日常护航,误删风险低。')) return;
  try{ await j('/preset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})}); toast(name==='safe-guard'?'已启用安全防护(冷却+候选)':'已应用仅观察'); await refresh() }catch(e){toast(e.message)}
}
async function runTick(){
  try{
    const r=await j('/run-tick',{method:'POST'});
    const c=(r&&r.cooldown_stats)||{};
    const n=c.cooling!=null?c.cooling:'?';
    toast('维护完成：已同步 CPA 禁用状态 · 当前冷却 '+n+' 个');
    await refresh();
  }catch(e){toast(e.message)}
}
let PATROL_TIMER=null, PATROL_CFG_DIRTY=false;
let PATROL_CFG_OPEN = localStorage.getItem('cpa-xai-sentry-patrol-cfg') === '1';
let PATROL_LOG_OPEN = localStorage.getItem('cpa-xai-sentry-patrol-log') === '1';
function syncPatrolPanels(){
  const cfg=document.getElementById('patrolCfgPanel');
  const log=document.getElementById('patrolLogWrap');
  const bCfg=document.getElementById('btnPatrolCfg');
  const bLog=document.getElementById('btnPatrolLog');
  if(cfg) cfg.classList.toggle('open', !!PATROL_CFG_OPEN);
  if(log) log.classList.toggle('open', !!PATROL_LOG_OPEN);
  if(bCfg) bCfg.textContent = PATROL_CFG_OPEN ? '配置 ▴' : '配置 ▾';
  if(bLog) bLog.textContent = PATROL_LOG_OPEN ? '日志 ▴' : '日志 ▾';
}
function togglePatrolCfg(){
  PATROL_CFG_OPEN = !PATROL_CFG_OPEN;
  localStorage.setItem('cpa-xai-sentry-patrol-cfg', PATROL_CFG_OPEN ? '1' : '0');
  syncPatrolPanels();
}
function togglePatrolLog(){
  PATROL_LOG_OPEN = !PATROL_LOG_OPEN;
  localStorage.setItem('cpa-xai-sentry-patrol-log', PATROL_LOG_OPEN ? '1' : '0');
  syncPatrolPanels();
}
function fillPatrolForm(cfg){
  if(PATROL_CFG_DIRTY) return;
  cfg=cfg||{};
  const set=(id,v)=>{const el=document.getElementById(id); if(el && document.activeElement!==el) el.value=(v==null?'':v)};
  set('pInterval', cfg.patrol_interval||3600);
  set('pTimeout', cfg.patrol_timeout||15);
  set('pConc', cfg.patrol_concurrency||8);
  set('pBatch', cfg.patrol_batch_size||50);
  set('pModel', cfg.patrol_model||'grok-4.5');
  set('pProxy', cfg.patrol_proxy_url||'');
  syncPatrolPanels();
}
function markPatrolDirty(){ PATROL_CFG_DIRTY=true; }
['pInterval','pTimeout','pConc','pBatch','pModel','pProxy'].forEach(id=>{
  // bound after DOM ready via refresh; also attach now if present
  const el=document.getElementById(id);
  if(el){ el.addEventListener('input', markPatrolDirty); el.addEventListener('change', markPatrolDirty); }
});
async function savePatrolCfg(){
  try{
    const body={
      patrol_enabled: !!document.getElementById('swPatrol')?.checked,
      patrol_interval: Number(document.getElementById('pInterval').value||3600),
      patrol_timeout: Number(document.getElementById('pTimeout').value||15),
      patrol_concurrency: Number(document.getElementById('pConc').value||8),
      patrol_batch_size: Number(document.getElementById('pBatch').value||50),
      patrol_model: (document.getElementById('pModel').value||'grok-4.5').trim(),
      patrol_proxy_url: (document.getElementById('pProxy').value||'').trim(),
    };
    CFG=await j('/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    PATROL_CFG_DIRTY=false;
    fillPatrolForm(CFG);
    toast('巡查配置已保存');
  }catch(e){ toast('保存失败:'+e.message) }
}
async function patrolStart(mode){
  try{
    // save current form first so run uses latest knobs
    if(PATROL_CFG_OPEN) await savePatrolCfg();
    const r=await j('/patrol/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:mode||'full'})});
    // when running, auto show progress; keep log closed unless user opened it
    paintPatrol(r.patrol||{});
    toast(mode==='cooldown'?'已启动：仅查冷却号':'已启动：全量巡查（会耗额度）');
    if(PATROL_TIMER) clearInterval(PATROL_TIMER);
    PATROL_TIMER=setInterval(patrolPoll, 1200);
    patrolPoll();
  }catch(e){ toast('巡查启动失败:'+e.message) }
}
async function patrolPoll(){
  try{
    const r=await j('/patrol/status');
    paintPatrol(r.patrol||{});
    if(!(r.patrol&&r.patrol.running)){
      if(PATROL_TIMER){ clearInterval(PATROL_TIMER); PATROL_TIMER=null; }
      // refresh accounts/logs after finish
      await refresh();
    }
  }catch(e){}
}
function paintPatrol(p){
  p=p||{};
  const sch=document.getElementById('patrolSchedule');
  if(sch){
    const last=p.last_patrol_at||p.finished_at||p.started_at||'-';
    const next=p.next_patrol_at||'-';
    const hint=p.next_patrol_hint?(' · '+p.next_patrol_hint):'';
    sch.textContent='上次巡查：'+last+' · 下次：'+next+hint;
  }
  const total=Number(p.total||0);
  const probed=Number(p.probed||0);
  const pct=total>0?Math.min(100, Math.round(probed*100/total)):(p.running?0:100);
  const st=document.getElementById('patrolStatus');
  if(st){
    if(p.running){
      st.textContent='进行中 · 模式 '+(p.mode||'-')+' · 目标 '+total+' · 已探测 '+probed+' · 存活 '+(p.alive||0)+' · 冷却信号 '+(p.cooldown||0)+' · 异常 '+(p.errors||0);
    }else{
      st.textContent=(p.message||'空闲')+(p.finished_at?(' · 结束 '+p.finished_at):'');
    }
  }
  const prog=document.getElementById('patrolProgress');
  const bar=document.getElementById('patrolBar');
  const pt=document.getElementById('patrolProgText');
  const pp=document.getElementById('patrolProgPct');
  if(prog){
    // show while running, or briefly after finish when there was work
    const show=!!p.running || (total>0 && !!p.finished_at);
    prog.classList.toggle('show', show);
  }
  if(bar) bar.style.width=pct+'%';
  if(pt) pt.textContent=probed+' / '+total+(p.running?' · 进行中':'');
  if(pp) pp.textContent=pct+'%';
  const box=document.getElementById('patrolLog');
  if(!box) return;
  // only refresh log content when log panel is open, to keep UI light
  if(!PATROL_LOG_OPEN) return;
  const logs=p.logs||[];
  if(!logs.length){ box.textContent='暂无巡查日志'; return; }
  box.innerHTML=logs.slice().reverse().slice(0,120).map(l=>{
    const lv=l.level||'info';
    const who=l.label||l.auth||'';
    let msg=l.text||'';
    // avoid double HTTP code if text already contains it
    if(l.code && !String(msg).includes(String(l.code))) msg += ' · HTTP '+l.code;
    return '<div class="pl"><div class="pt">'+esc(l.at||'')+'</div><div class="pm '+lv+'">'+esc((who?who+' · ':'')+msg)+'</div></div>';
  }).join('');
}
async function restore(id,enable){ try{ await j('/trash/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,enable})}); toast(enable?'已恢复并启用':'已恢复(禁用)'); await refresh() }catch(e){toast(e.message)} }
async function purge(id){ if(!confirm('彻底清除后不可恢复,确认?')) return; try{ await j('/trash/purge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,confirm:true})}); toast('已清除'); await refresh() }catch(e){toast(e.message)} }
async function purgeExpired(){ if(!confirm('清理所有到期垃圾箱项?')) return; try{ await j('/trash/purge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expired:true,confirm:true})}); toast('到期项已清理'); await refresh() }catch(e){toast(e.message)} }
function selectedAuths(){return Array.from(document.querySelectorAll('.rowchk:checked')).map(el=>el.getAttribute('data-auth')).filter(Boolean)}
function selAll(on){
  document.querySelectorAll('.rowchk').forEach(el=>{el.checked=!!on});
  const all=document.getElementById('chkAll'); if(all) all.checked=!!on;
}
async function bulk(action){
  const auths=selectedAuths();
  if(!auths.length){ toast('请先勾选账号'); return; }
  const label={disable:'禁用',enable:'启用',trash:'移入垃圾箱',cooldown:'冷却'}[action]||action;
  if(!confirm('对当前勾选的 '+auths.length+' 个账号执行「'+label+'」?'+(action==='trash'?'\n删除会进垃圾箱(可恢复),不是立刻硬删。':''))) return;
  try{
    const res=await j('/accounts/bulk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,auths,confirm:true})});
    toast(label+' 成功 '+(res.success||0)+' / 失败 '+(res.failed||0));
    await refresh();
  }catch(e){ toast(e.message) }
}
async function bulkOne(auth, action){
  if(!auth){ toast('账号为空'); return; }
  const label={disable:'禁用',enable:'启用',trash:'移入垃圾箱',cooldown:'冷却'}[action]||action;
  if(!confirm('对账号执行「'+label+'」?')) return;
  try{
    const res=await j('/accounts/bulk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,auths:[auth],confirm:true})});
    toast(label+' 成功 '+(res.success||0)+' / 失败 '+(res.failed||0));
    ERR_RENDERED=false;
    await refresh();
    if(CURRENT_TAB==='errors') await loadErrors(true);
  }catch(e){ toast(e.message) }
}
async function cooldownSuggested(){
  if(!confirm('对当前「建议冷却」的 active+free_usage_429 账号一键执行冷却?\n(按默认最长 24h / max_reset_seconds)')) return;
  try{
    const res=await j('/accounts/cooldown-suggested',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({confirm:true,hours:24})});
    toast('已冷却 '+(res.cooled||0)+' 个账号');
    await refresh();
  }catch(e){ toast(e.message) }
}
document.addEventListener('click',function(ev){
  const t=ev.target;
  if(t.classList.contains('btn-restore')) restore(t.getAttribute('data-id'), false);
  if(t.classList.contains('btn-restore-en')) restore(t.getAttribute('data-id'), true);
  if(t.classList.contains('btn-purge')) purge(t.getAttribute('data-id'));
});
const saved=localStorage.getItem(KEY_LS)||''; if(saved) document.getElementById('cfgKey').value=saved;
syncMaskBtn();
syncPatrolPanels();
refresh(); setInterval(refresh,15000);
</script>
